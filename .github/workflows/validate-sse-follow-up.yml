name: Validate SSE follow-up
on:
  push:
    branches: [validation/mimo-follow-up-20260930]
permissions:
  contents: read
jobs:
  sse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d421c78c501c59c706506ce837eb09a8bf68016c
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Native SSE tests
        working-directory: packages/cli
        run: bun test test/control-plane/sse-chunks.test.ts test/control-plane/sse.test.ts
      - name: Lint changed source and test
        run: bunx --no-install oxlint packages/cli/src/control-plane/sse.ts packages/cli/test/control-plane/sse-chunks.test.ts
      - name: Package typecheck
        working-directory: packages/cli
        run: bun run typecheck
